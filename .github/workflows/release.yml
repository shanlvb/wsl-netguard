name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          package_path="github.com/shanlvb/wsl-netguard/internal/version"
          ldflags="-s -w -X ${package_path}.Version=${version} -X ${package_path}.Commit=${commit} -X ${package_path}.Date=${built_at}"

          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            artifact="wsl-netguard_${version}_${os}_${arch}"

            mkdir -p "dist/${artifact}"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="${ldflags}" -o "dist/${artifact}/wsl-netguard" ./cmd/wsl-netguard

            cp README.md LICENSE "dist/${artifact}/"
            if [[ "${os}/${arch}" == "linux/amd64" ]]; then
              "dist/${artifact}/wsl-netguard" version
            fi
            tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
            rm -rf "dist/${artifact}"
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --verify-tag \
            --title "wsl-netguard ${GITHUB_REF_NAME}" \
            --notes "Initial GitHub release for wsl-netguard."
